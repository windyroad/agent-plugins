description = "Architecture reviewer for structural and technology decisions. Use before editing any project file. Reviews proposed changes against existing decisions in docs/decisions/ and flags when new decisions should be documented. Checks source code for compliance with documented decisions (e.g. API patterns, dependency choices, state machine rules). Works even when no decisions exist yet."
