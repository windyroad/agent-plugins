description: Style-guide reviewer canonical verdict output

providers:
  - id: 'exec:bash ./run-agent-eval.sh'

defaultTest:
  options:
    provider:
      id: 'exec:bash ./grade-llm-rubric.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: A non-styling change emits one PASS heading and no file-write instruction
    vars:
      prompt: |
        Review this proposed change: reorder two imports in a TypeScript utility.
        It changes no CSS, component markup, visual token, or user-facing text.
        Return your normal review report.
    assert:
      - type: regex
        value: '^(?:(?!\*\*Style Guide Review:)[\s\S])*\*\*Style Guide Review: PASS\*\*(?:(?!\*\*Style Guide Review:)[\s\S])*$'
      - type: not-regex
        value: '/tmp/style-guide-verdict'
      - type: llm-rubric
        value: |
          PASS only when the output contains exactly one canonical Style Guide
          Review verdict heading, that heading is PASS, and the output does not
          instruct any caller or reviewer to write a /tmp verdict file.
