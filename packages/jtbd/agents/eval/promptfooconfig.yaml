# Agent-prose verdict eval — jtbd review agent (RFC-012 S1 / P324).
#
# The FIRST behavioural harness for an agent-prose verdict surface (the jtbd
# review agent's PASS / ISSUES FOUND / [Unratified Dependency] verdicts). It
# exercises the REAL agent (`claude -p --system-prompt "$(cat ../agent.md)"`,
# subscription auth) against fixture proposed-changes and asserts on the
# emitted verdict — the behavioural alternative to the ADR-052 Surface-2
# structural-grep escape hatch that RFC-010/RFC-011 shipped under. This is the
# agent-prose twin of the SKILL evals (packages/itil/skills/*/eval/).
#
# Each fixture has one authoritative outcome. Assert the emitted contract
# directly. A second LLM judge adds no semantic signal here and made identical
# correct outputs alternate PASS/FAIL in CI run 31537137532.
#
# JTBD-011 currently carries `human-oversight: unconfirmed`, so the first
# fixture pins the positive [Unratified Dependency] branch. The second pins
# the inverse-P078/P132 over-fire guard for an ambient change with no explicit
# dependency. See P324 + RFC-012.
#
# Run from repo root:
#   npx promptfoo eval -c packages/jtbd/agents/eval/promptfooconfig.yaml
#
# @jtbd JTBD-001 (Enforce Governance Without Slowing Down)
# @jtbd JTBD-002 (Ship AI-Assisted Code with Confidence)
# @jtbd JTBD-011 (Have a Correction to the Agent's Conduct Hold Everywhere)
# @problem P324
# @rfc RFC-012 S1
# @adr ADR-075 (per-package agent eval; Tier-A/Tier-B)
# @adr ADR-052 (behavioural-tests-default; Surface-2 narrowing)

description: |
  jtbd review-agent verdict eval — correct ISSUES FOUND classification on an
  unratified job citation, and the inverse-P078/P132 over-fire guard
  ([Unratified Dependency] must NOT fire on ambient alignment).

# Serialize the fixtures because each agent run writes a subordinate verdict
# handoff. The runner isolates that file per invocation, while Promptfoo grades
# the authoritative inline verdict.
evaluateOptions:
  maxConcurrency: 1

providers:
  # Path is relative to this config file's directory (promptfoo basePath).
  - id: 'exec:bash ./run-agent-eval.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: ISSUES FOUND on a proposal explicitly citing unratified JTBD-011
    vars:
      prompt: |
        PRE-EDIT alignment gate. Review this PROPOSED change against the
        documented jobs and personas in docs/jtbd/.

        Proposed change: edit `docs/agent-instructions/shared-governance.md`
        so a correction to agent conduct is captured once and holds across
        both runtime surfaces. The change adds an `@jtbd JTBD-011` annotation
        marking the file as serving that job.
        Nothing else in the jtbd corpus changes.

        Classify the alignment of this proposal and give your verdict inline,
        beginning with the `JTBD Review:` verdict line.
    assert:
      # The inline verdict is the authoritative channel. Pin both the verdict
      # and the reason so a generic alignment failure cannot pass this case.
      - type: icontains
        value: 'JTBD Review: ISSUES FOUND'
      - type: icontains
        value: 'Unratified Dependency'

  - description: Over-fire guard — ambient change, no explicit cite, no [Unratified Dependency]
    vars:
      prompt: |
        PRE-EDIT alignment gate. Review this PROPOSED change against the
        documented jobs and personas in docs/jtbd/.

        Proposed change: a small formatting-only refactor to
        `packages/itil/skills/list-problems/SKILL.md` that adjusts the column
        widths of the read-only backlog table it prints. The change adds NO
        `@jtbd` annotation and cites no persona or job. It is a purely
        presentational tweak with no new user flow.

        Classify the alignment of this proposal and give your verdict inline,
        beginning with the `JTBD Review:` verdict line. State explicitly
        whether you raise an [Unratified Dependency] flag.
    assert:
      # PASS is the complete authoritative outcome for this fixture: an
      # Unratified Dependency finding would require ISSUES FOUND instead.
      - type: icontains
        value: 'JTBD Review: PASS'

  - description: Recommendation review rejects an option that contradicts a desired outcome
    vars:
      prompt: |
        RECOMMENDATION REVIEW. Before presenting this user-facing capability
        option set, review it against confirmed JTBD-001 and the developer
        persona. Option A removes automatic review and asks the developer to
        inspect every change manually. Option B keeps automatic review.

        Begin with the `JTBD Recommendation Review:` verdict line. Do not edit
        files and do not choose among viable aligned options.
    assert:
      - type: icontains
        value: 'JTBD Recommendation Review: ISSUES FOUND'
      - type: icontains
        value: 'contradicts'

  - description: Recommendation review rejects an option that does not serve the outcome
    vars:
      prompt: |
        RECOMMENDATION REVIEW. Review this user-facing capability recommendation
        against confirmed JTBD-001 and the developer persona: add a decorative
        dashboard theme selector as the proposed answer to the need for automatic
        governance review.

        Begin with the `JTBD Recommendation Review:` verdict line.
    assert:
      - type: icontains
        value: 'JTBD Recommendation Review: ISSUES FOUND'
      - type: icontains
        value: 'does not serve'

  - description: Recommendation review reports an incomplete option set
    vars:
      prompt: |
        RECOMMENDATION REVIEW. Review this option set against confirmed JTBD-001
        and the developer persona. The only option is a manual review checklist;
        no option preserves automatic review before edits.

        Begin with the `JTBD Recommendation Review:` verdict line.
    assert:
      - type: icontains
        value: 'JTBD Recommendation Review: ISSUES FOUND'
      - type: icontains
        value: 'incomplete'

  - description: Recommendation review passes aligned options without choosing for the user
    vars:
      prompt: |
        RECOMMENDATION REVIEW. Review these options against confirmed JTBD-001
        and the developer persona. Option A runs the existing automatic reviewer
        before edits. Option B runs that reviewer before edits and before
        user-facing capability recommendations. Both keep review automatic.

        Begin with the `JTBD Recommendation Review:` verdict line. Do not choose
        between viable aligned options.
    assert:
      - type: icontains
        value: 'JTBD Recommendation Review: PASS'
      - type: not-icontains
        value: 'I recommend Option'
