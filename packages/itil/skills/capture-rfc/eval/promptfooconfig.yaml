description: capture-rfc row-based planning contract

providers:
  - id: 'exec:bash ./run-skill-eval.sh'

defaultTest:
  options:
    provider:
      id: 'exec:bash ./grade-llm-rubric.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: Existing planning vehicle receives a traced RFC row and story
    vars:
      prompt: |
        Problem P123 is a known error. An approved story map already contains
        the relevant activity and job, but it has no RFC row or delivery story
        for this fix. Explain the exact capture-rfc actions.
    assert:
      - type: contains
        value: add-band
      - type: contains
        value: add-card
      - type: contains
        value: wr-itil-next-rfc-id
      - type: not-regex
        value: 'docs/rfcs/RFC-.*\.proposed\.md'
      - type: llm-rubric
        value: |
          PASS only if the response reuses the existing story map, draws one
          problem-traced RFC row, attaches at least one traced story, and does
          not create a standalone RFC document.

  - description: A missing story map is authored before ratification
    vars:
      prompt: |
        Problem P124 has no story maps yet. It has a resolved problem trace and
        ratified job and decision context for the proposed fix. Explain what
        capture-rfc does before any source implementation begins.
    assert:
      - type: llm-rubric
        value: |
          PASS only if the response says the workflow authors a complete
          unconfirmed map proposal without asking permission, including the
          required release row, cards, and story files; then asks or queues only
          ratification of the completed proposal and blocks source/story
          implementation until ratification.
          FAIL if it asks permission to create the map, skips proposal authoring,
          auto-ratifies, creates a standalone RFC document, or implements the fix.
