description: capture-rfc row-based planning contract

providers:
  - id: 'exec:bash ./run-skill-eval.sh'

defaultTest:
  options:
    provider:
      id: 'exec:bash ./grade-llm-rubric.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: Existing planning vehicle receives a traced RFC row and story
    vars:
      prompt: |
        Problem P123 is a known error. An approved story map already contains
        the relevant activity and job, but it has no RFC row or delivery story
        for this fix. Explain the exact capture-rfc actions.
    assert:
      - type: contains
        value: add-band
      - type: contains
        value: add-card
      - type: contains
        value: wr-itil-next-rfc-id
      - type: not-regex
        value: 'docs/rfcs/RFC-.*\.proposed\.md'
      - type: llm-rubric
        value: |
          PASS only if the response reuses the existing story map, draws one
          problem-traced RFC row, attaches at least one traced story, and does
          not create a standalone RFC document.

  - description: Missing planning or decision substance is queued, not invented
    vars:
      prompt: |
        Problem P124 has no suitable approved story map, activity, job, or
        ratified decision for the proposed fix. Explain what capture-rfc does.
    assert:
      - type: regex
        value: 'AskUserQuestion|request_user_input|queue'
      - type: llm-rubric
        value: |
          PASS only if the response briefs and asks or queues the missing human
          direction, creates no RFC row or document, and does not amend a
          ratified decision with new substance.
