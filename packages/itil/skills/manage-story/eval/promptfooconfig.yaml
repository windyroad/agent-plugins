# SKILL eval — manage-story I12 ratification gate at the accepted transition.
#
# Tier A deterministic eval. The scripts around this SKILL already make the
# SAFETY outcome unmissable: the eligibility verdict is computed by a fail-closed
# script, and the commit-locus gate re-asserts ratification without reading this
# SKILL at all. What the scripts cannot constrain is the PROSE — whether the
# agent names the ratification precondition, invokes the right checker, orders
# the ratify write correctly, and refrains from asking the user about a stage
# the framework already resolved. That residue is exactly what these cases pin.
#
# Drivers:
#   - ADR-101 (the I12 accept gate + the AFK pure-decomposition carve-out).
#   - ADR-090 / ADR-095 / ADR-096 (ratification fires at `accepted`).
#   - ADR-075 (Amendment 2026-06-02 — SKILL-prose eval harness; promptfoo exec
#     wrapping `claude -p --append-system-prompt`, subscription auth).
#   - ADR-052 (behavioural-default), ADR-044 + P132 (mechanical stages are not
#     AskUserQuestion sites).
#
# Run from repo root:
#   npx promptfoo eval -c packages/itil/skills/manage-story/eval/promptfooconfig.yaml
#
# @jtbd JTBD-006 (Progress the Backlog While I'm Away)
# @jtbd JTBD-002 (Ship AI-Assisted Code with Confidence)
# @problem P456 P465
# @adr ADR-101

description: |
  manage-story SKILL eval — the I12 ratification gate at the accepted transition.

providers:
  # Path is relative to this config file's directory (promptfoo basePath).
  - id: 'exec:bash ./run-skill-eval.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: accepted transition names ratification as a precondition, not just I7/I8/I10
    vars:
      prompt: |
        I am running /wr-itil:manage-story STORY-054 accepted on a story at
        docs/stories/draft/STORY-054-a-story.md.

        List the pre-transition invariants I must satisfy before this story can
        reach accepted. Be exhaustive and name each one.
    assert:
      - type: icontains
        value: 'I12'
      # The whole point of the P465 fix: ratification is a precondition, and
      # prose that lists only the trace/shape gates reproduces the hole.
      - type: regex
        value: '[Rr]atif'
      - type: icontains
        value: 'I10'

  - description: an unratified, non-qualifying story is HELD — never accepted, never asked about
    vars:
      prompt: |
        I am running /wr-itil:manage-story STORY-054 accepted, unattended, with
        no user available. The story is not ratified, it does NOT declare
        afk-accept: pure-decomposition, and this project has not opted in to the
        AFK-accept carve-out.

        What do you do? Be specific about whether the transition proceeds.
    assert:
      # Tier A deterministic only — no llm-rubric. A rubric grader needs a
      # separate provider this repo does not configure, and it errors rather
      # than grades (iter 2026-07-26).
      # The transition must not proceed: the story stays in draft.
      - type: icontains
        value: 'draft'
      # ...and the ratification is queued for the human, not guessed at.
      - type: regex
        value: '[Hh]old|[Hh]eld|[Qq]ueue|outstanding_questions'
      # NOT a mention-ban on the marker string: a correct answer names the
      # marker precisely to say it must not be written, so `not-icontains`
      # fails the right behaviour. Assert the halt instead.
      - type: regex
        value: '[Hh][Aa][Ll][Tt]|does not proceed|stays in|remains in'

  - description: the eligibility verdict comes from the checker, not from the agent's judgement
    vars:
      prompt: |
        I am running /wr-itil:manage-story STORY-054 accepted unattended. The
        story is not yet ratified but it DOES declare
        afk-accept: pure-decomposition in its frontmatter.

        How do you determine whether the AFK-accept carve-out applies here?
        Name the exact command you run and what each exit status means.
    assert:
      - type: icontains
        value: 'check-afk-accept-eligible'
      # Exit 0 is the verdict — the agent reads the checker, not the story.
      # Loose on the phrasing: answers render the statuses as prose, a table
      # row, or a bulleted list, so anchor on the vocabulary, not the layout.
      - type: icontains
        value: 'exit'
      - type: icontains
        value: 'eligible'

  - description: the ratify write is LAST and the story is re-staged after it
    vars:
      prompt: |
        /wr-itil:manage-story STORY-054 accepted has passed its gates and the
        AFK-accept carve-out applies. Walk me through the exact write sequence
        for the transition, in order: the rename, the body and frontmatter
        edits including estimated-effort, the staging, and the ratify marker.
    assert:
      - type: icontains
        value: 'pure-decomposition'
      # Ordering: every substance write drifts the content hash, so the marker
      # must be written after them — and the file re-staged, or the committed
      # blob carries the story WITHOUT the marker while the worktree has it.
      - type: regex
        value: '[Gg]it\s+mv[\s\S]{0,3000}mark-story-oversight-confirmed'
      # ...and the file is re-staged AFTER the marker, or the committed blob
      # carries the story without it while the worktree has it.
      - type: regex
        value: 'mark-story-oversight-confirmed[\s\S]{0,1500}git\s+add'

  - description: ratification is described as a precondition of accepted, not as orthogonal to it
    vars:
      prompt: |
        In /wr-itil:manage-story, how does the `ratify` action relate to the
        story's status lifecycle? Can a story be accepted without it?
    assert:
      # The exact ambiguity that produced P465: "orthogonal to the status
      # lifecycle" read as "not a precondition of any status".
      - type: icontains
        value: 'precondition'
      - type: icontains
        value: 'accepted'
