# SKILL eval — transition-problem Step 7b grep pre-check (P362).
#
# Tier A deterministic eval — asserts that when prompted to describe the
# Step 7b "Bidirectional upstream lifecycle update (P080)" sub-step from
# /wr-itil:transition-problem, the agent gates the `/wr-itil:update-upstream`
# Skill-tool dispatch behind a caller-side `grep -q '^## Reported Upstream'`
# pre-check — dispatching only when the section exists and skipping-with-log
# otherwise — rather than dispatching unconditionally.
#
# Drivers:
#   - ADR-075 (Amendment 2026-06-02 — SKILL-prose scope extension; harness
#     provider: promptfoo exec wrapping `claude -p --append-system-prompt`
#     — subscription auth, no API key).
#   - ADR-052 (behavioural-default for skill testing).
#   - ADR-024 (P362 mechanism-refinement amendment — caller-side grep gate
#     replaces sibling-skill no-op absorption as the common-case short-circuit).
#   - ADR-054 (SKILL.md runtime-budget policy — the ~14 KB context-load this
#     pre-check elides on the common no-section case).
#   - P362 (this slice's landing discharges its R009 prose-surface floor).
#
# This is the first eval slice for transition-problem; it covers the Step 7b
# lockstep copy of the same P080 trigger paragraph evaluated for manage-problem
# Step 7 (ADR-010 P093 copy-not-move pair).
#
# Run from repo root:
#   npx promptfoo eval -c packages/itil/skills/transition-problem/eval/promptfooconfig.yaml
#
# @jtbd JTBD-001 (Enforce Governance Without Slowing Down)
# @jtbd JTBD-006 (Progress the Backlog While I'm Away)
# @problem P362
# @adr ADR-024 (P362 amendment) + ADR-054 + ADR-075 (Amendment 2026-06-02)

description: |
  transition-problem SKILL eval — P362 grep pre-check gates update-upstream dispatch.

providers:
  # Path is relative to this config file's directory (promptfoo basePath).
  - id: 'exec:bash ./run-skill-eval.sh'

# Tier-B grading provider — semantic NEGATIVE clauses ("does NOT require the
# user's confirmation", "does NOT close on inference") false-fail under a
# regex, which cannot tell "must-not-X satisfied" from "the word X appears
# inside a negating clause". Those route to llm-rubric, graded by claude under
# subscription auth (no API key) via grade-llm-rubric.sh. Same pattern as
# packages/itil/skills/work-problems/eval/. (P519)
defaultTest:
  options:
    provider:
      id: 'exec:bash ./grade-llm-rubric.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: Step 7b upstream lifecycle — grep pre-check gates update-upstream dispatch (P362)
    vars:
      prompt: |
        I am executing /wr-itil:transition-problem Step 7b "Bidirectional
        upstream lifecycle update (P080)" for a problem ticket at
        docs/problems/known-error/211-foo.md that I am transitioning to
        Verification Pending. The ticket has NO `## Reported Upstream` section
        header.

        Before I reach the Step 8 commit, do I dispatch
        /wr-itil:update-upstream, and if so what exactly runs first? Be
        specific about any mechanical check that decides whether the Skill
        tool is invoked at all.
    assert:
      # Tier A — must describe the grep pre-check on the section header.
      - type: regex
        value: 'grep[\s\S]{0,80}Reported\s+Upstream'
      # Tier A — must reference the `## Reported Upstream` section anchor.
      - type: contains
        value: '## Reported Upstream'
      # Tier A — must name the skill being gated.
      - type: contains
        value: 'update-upstream'
      # Tier A — must surface the skip-the-dispatch outcome for the
      # no-section case (the common no-op the pre-check short-circuits).
      - type: regex
        value: '[Ss]kip|do\s+not\s+(dispatch|invoke)|no[- ]op|don.t\s+(dispatch|invoke)'
      # Tier A — ORDERING: the grep pre-check must appear BEFORE the
      # /wr-itil:update-upstream dispatch. JS RegExp compat (char classes for
      # case-insensitivity, `[\s\S]` for dotall).
      - type: regex
        value: 'grep[\s\S]{0,1200}update-upstream'
      # Tier A — must NOT describe an unconditional dispatch as the first
      # action (the P362-regressing shape — fire update-upstream on every
      # transition, then rely on the sibling no-op exit).
      - type: not-regex
        value: '(^|\n)\s*/wr-itil:update-upstream[\s\S]{0,400}grep[\s\S]{0,80}Reported\s+Upstream'

  - description: Open to Known Error transition re-rates status multiplier with Effort (P498)
    vars:
      prompt: |
        I am transitioning an Open problem with Severity 9 to Known Error.
        Its clarified fix changes Effort from M to L (divisor 4). What WSJF
        re-rates are required, and what value is written after the transition?
    assert:
      - type: contains
        value: '2.0'
      - type: regex
        value: '4\.5'
      - type: regex
        value: '[Ss]tatus\s+[Mm]ultiplier|[Pp]ost-transition\s+status'

  - description: P512 — a released fix can move Open directly to Verification Pending
    vars:
      prompt: |
        I am executing /wr-itil:transition-problem for an Open ticket. Its
        root cause, investigation, reproduction, workaround, re-rated WSJF,
        effort, implemented fix, and released fix are all complete. Its
        `## Fix Released` section names version 2.4.1, commit abc1234, and
        release date 2026-08-30. No deferral is being lifted.

        May I transition it directly to Verification Pending? State the
        required preflight and whether an intermediate Known Error commit is
        needed.
    assert:
      - type: llm-rubric
        value: |
          The response allows a direct Open → Verification Pending transition
          only after ALL preflight checks listed for Open → Known Error and
          Known Error → Verification Pending pass, including an objectively
          populated `## Fix Released` section that names a version, commit, and
          release date. It says the ticket is renamed directly from the Open
          location to the verifying location and its status is updated, with
          NO intermediate Known Error commit or transition. Do not treat
          route-specific mechanics outside the listed preflight, such as
          release-vehicle seeding for a ticket that is already Known Error, as
          an additional precondition for this folded route.

  # ── P519: evidence-backed V→C closure is agent-authorised ─────────────────
  # The reservation these cases replace made the verification queue
  # structurally undrainable: 153 verifying tickets, exactly one carrying a
  # populated evidence cell, and an agent that would find in-session proof a
  # fix worked and still decline to act on it. The three cases below pin the
  # three states the prose must distinguish — evidence closes, inference never
  # does, and a recorded marker blocks regardless.

  - description: P519 — cited evidence closes V→C without asking the user
    vars:
      prompt: |
        I am executing /wr-itil:transition-problem for ticket 211 at
        docs/problems/verifying/211-foo.md with status argument `close`.

        The ticket's `## Fix Released` section names
        packages/itil/scripts/foo.sh and its test file. Earlier this session I
        ran `npx bats packages/itil/scripts/test/foo.bats` and it returned
        12/12 passing, exercising exactly that fix path. There is no user in
        this session to ask — it is an AFK iteration. The ticket carries no
        do-not-close marker.

        Do I perform the Verification Pending → Closed transition now, or do I
        stop and wait for the user to confirm the fix works? Answer decisively
        and say what I record with the transition.
    assert:
      # Must actually close, not defer.
      - type: llm-rubric
        value: |
          The response decides to PERFORM the Verification Pending → Closed
          transition now, on the strength of the cited bats evidence. It must
          NOT say the transition requires the user's explicit confirmation,
          must NOT say only the user/maintainer can make this call, and must
          NOT defer or queue the close for the user's return.
      # Must record the citation with the close (ADR-026 grounding).
      - type: llm-rubric
        value: |
          The response states that the evidence citation (the bats invocation
          and its 12/12 outcome) is recorded in the closure.
      # Must not route through AskUserQuestion — the P132 mechanical carve-out.
      - type: not-regex
        value: '\b(I|we)\s+(will|should|must|need to|am going to|are going to)\s+(call|invoke|fire|use|raise)\s+(the\s+|an?\s+)?`?AskUserQuestion'

  - description: P519 — no evidence means no close, however old the ticket
    vars:
      prompt: |
        I am executing /wr-itil:transition-problem for ticket 212 at
        docs/problems/verifying/212-bar.md with status argument `close`.

        The fix shipped seven months ago and the code is still on disk. The
        Verification Queue cell for this ticket reads `no — not observed`.
        Nothing in this session exercised the fix — I have no test run, no
        commit touching the path, no skill or hook invocation to point at. It
        is an AFK iteration.

        Do I close it? The queue is very large and this ticket is one of the
        oldest in it.
    assert:
      - type: llm-rubric
        value: |
          The response REFUSES to close the ticket, and grounds the refusal in
          the absence of cited evidence — not in a rule that closure belongs to
          the user. Age, the fix being on disk, and queue size must all be
          rejected as reasons to close. Some form of the principle "absence of
          evidence is not evidence" or "never close on inference" must be
          present. The ticket stays Verification Pending.

  - description: P519 — a recorded do-not-close marker outranks the evidence
    vars:
      prompt: |
        I am executing /wr-itil:transition-problem for ticket 151 at
        docs/problems/verifying/151-published-skills-reference-repo-relative-script-paths.md
        with status argument `close`.

        This session ran the ticket's full bats suite and it passed 30/30,
        exercising the fix path directly — strong evidence by the usual bar.
        However the ticket body contains this section heading:

            ## Regression / incomplete observed 2026-07-25 — DO NOT CLOSE

        Do I close it? What mechanical check applies here and what does it
        return?
    assert:
      - type: llm-rubric
        value: |
          The response REFUSES to close, and says the recorded do-not-close
          marker outranks the passing evidence. It must NOT close on the
          strength of the 30/30 result.
      # Must name the mechanical predicate rather than eyeballing the prose.
      - type: contains
        value: 'is-close-blocked'
      # Exit 0 = blocked is the contract the predicate publishes.
      - type: regex
        value: '[Ee]xit\s*(code\s*)?0|returns\s*0|BLOCKED'

  - description: P519 — an observed-regression cell routes to flip-back, never to close
    vars:
      prompt: |
        I am executing /wr-itil:transition-problem for ticket 213 at
        docs/problems/verifying/213-baz.md with status argument `close`.

        Its Verification Queue cell reads
        `no — observed regression — the hook misfired again on 2026-08-19`.
        Separately, this session's bats run over the ticket's test file came
        back green.

        Do I close it?
    assert:
      - type: llm-rubric
        value: |
          The response REFUSES to close, and routes the ticket to a flip-back
          from Verification Pending to Known Error rather than treating it as a
          closure candidate. The green bats run must not override the recorded
          regression.

  - description: P519 — the close's authority basis is written to the Status line, not the README cell
    vars:
      prompt: |
        I am executing /wr-itil:transition-problem for ticket 214 at
        docs/problems/verifying/214-qux.md with status argument `close`.

        This session ran the ticket's test file, 8/8 green over the fix path,
        so the close is authorised by my own evidence rather than by anything
        the user said. The ticket is `**Origin**: inbound-reported (#412)`.

        Where exactly do I record that the close was evidence-authorised, and
        why there?
    assert:
      - type: llm-rubric
        value: |
          The response says the basis is written into the ticket's `**Status**:`
          line (a `closed-on-evidence <date> — <citation>` form), and gives the
          reason: the README Verification Queue's `Likely verified?` cell is
          destroyed by this very transition, because the transition removes the
          ticket's row from that table, so a downstream reader would find
          nothing there. It is acceptable to also update the cell, but the
          response must NOT present the cell as the sole or primary location.
          Bonus if it names update-upstream Step 7b as the downstream reader
          that greps the Status line.
      - type: not-regex
        value: 'only in the `Likely verified\?` cell'

  - description: P525 — an evidence-authorised close treats proven owned and foreign issue legs independently
    vars:
      prompt: |
        I am executing /wr-itil:transition-problem for ticket 214 at
        docs/problems/verifying/214-qux.md with status argument `close`.

        This session ran the ticket's test file, 8/8 green over the fix path —
        so I am closing it on my own evidence, not on anything the user said.
        The ticket carries `**Origin**: inbound-reported (#412)` and a
        `## Reported Upstream` section pointing at a third party's GitHub
        issue. Step 7b will therefore dispatch /wr-itil:update-upstream.

        The current repo is `windyroad/agent-plugins`. Its committed upstream
        cache has exactly one `github-issues:windyroad/agent-plugins` report
        numbered 412 whose `matched_local_ticket` is exactly `P214`, and no
        same-number non-issue record. The foreign maintainer has not confirmed
        closure.

        What happens on each leg?
    assert:
      - type: llm-rubric
        value: |
          The response treats the legs independently. After validating the
          committed cache provenance, it posts the inbound lifecycle comment
          and closes own-repo issue #412. On the foreign issue it posts the
          lifecycle comment but does NOT run gh issue close, because local
          evidence cannot decide another maintainer's tracker state. It may
          note that the foreign maintainer's confirmation could authorize that
          closure. FAIL if it closes the foreign issue, leaves the proven owned
          issue open, or performs the inbound issue operation before the cache
          guard.
