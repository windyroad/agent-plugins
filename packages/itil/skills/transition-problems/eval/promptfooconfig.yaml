description: transition-problems SKILL eval - post-transition WSJF (P498)

providers:
  - id: 'exec:bash ./run-skill-eval.sh'

# Tier-B grading provider — semantic NEGATIVE clauses ("does NOT require the
# user's confirmation", "does NOT close on inference") false-fail under a
# regex, which cannot tell "must-not-X satisfied" from "the word X appears
# inside a negating clause". Those route to llm-rubric, graded by claude under
# subscription auth (no API key) via grade-llm-rubric.sh. Same pattern as
# packages/itil/skills/work-problems/eval/. (P519)
defaultTest:
  options:
    provider:
      id: 'exec:bash ./grade-llm-rubric.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: Batch Open to Known Error transition re-rates the status multiplier (P498)
    vars:
      prompt: |
        In /wr-itil:transition-problems, an Open problem has Severity 9 and
        Effort L (divisor 4). The batch transitions it to Known Error. What
        status multiplier and WSJF must the pre-flight checklist persist?
    assert:
      - type: contains
        value: '2.0'
      - type: regex
        value: '4\.5'
      - type: regex
        value: '[Ss]tatus\s+[Mm]ultiplier|[Pp]ost-transition\s+status'
      - type: not-contains
        value: '2.25'

  - description: P512 — batch preflight distinguishes complete and heading-only Open fast paths
    vars:
      prompt: |
        I am invoking /wr-itil:transition-problems with two Open → verifying
        pairs. Both tickets satisfy the normal Open → Known Error and Known
        Error → Verification Pending checks.

        - 401 has `## Fix Released` naming version 2.4.1, commit abc1234, and
          release date 2026-08-30.
        - 402 has only an empty `## Fix Released` heading.

        What does the batch do with each pair? Is an intermediate Known Error
        commit required for 401?
    assert:
      - type: llm-rubric
        value: |
          The response transitions 401 directly from Open to Verification
          Pending with no intermediate Known Error commit. It rejects 402 at
          preflight because a heading alone is not objective release evidence,
          records the failure, and does not partially mutate 402. It preserves
          the batch's per-pair preflight and outcome reporting.

  # ── P519: batch grain closes exactly the evidenced pairs ──────────────────
  - description: P519 — mixed batch closes the evidenced pair only
    vars:
      prompt: |
        I am invoking /wr-itil:transition-problems with three pairs, all
        `verifying → close`:

          - 301 — this session ran its bats suite, 9/9 green over the fix path.
          - 302 — no evidence at all; its Verification Queue cell reads
            `no — not observed`. Shipped five months ago.
          - 303 — this session exercised it successfully, but its body carries
            a `## Regression observed — DO NOT CLOSE` heading.

        This is an AFK run with no user to ask. How many of the three close,
        and what is recorded for each of the others?
    assert:
      - type: llm-rubric
        value: |
          The response closes EXACTLY ONE ticket — 301 — on its cited bats
          evidence, without requiring prior user authorisation or an
          AskUserQuestion at the orchestrator layer.
      - type: llm-rubric
        value: |
          The response does NOT close 302, on the grounds that no evidence was
          cited (age and the fix shipping are rejected as grounds), and does
          NOT close 303, because its recorded do-not-close marker outranks the
          successful exercise. A reason is recorded for each rather than the
          pairs being dropped silently.
      - type: not-regex
        value: '\b(I|we)\s+(will|should|must|need to|am going to|are going to)\s+(call|invoke|fire|use|raise)\s+(the\s+|an?\s+)?`?AskUserQuestion'
