# Agent-prose verdict eval — architect review agent (RFC-012 / P324).
#
# The agent-prose twin of the jtbd review-agent eval (packages/jtbd/agents/
# eval/) — exercises the REAL architect agent (`claude -p --system-prompt
# "$(cat ../agent.md)"`, subscription auth) against fixture proposed-changes
# and asserts on the emitted verdict (PASS / ISSUES FOUND / NEEDS DIRECTION /
# [Unratified Dependency]). The behavioural alternative to the ADR-052
# Surface-2 structural-grep escape hatch that RFC-010 shipped under; completes
# the architect+jtbd harness pair and unblocks P290 (remove the structural
# escape hatch — was half-blocked while only jtbd had a behavioural twin).
#
# Two tiers (ADR-075):
#   - Tier A: deterministic `icontains` positive anchor on the verdict token.
#   - Tier B: `llm-rubric` for the negative-clause / semantic checks that a
#     regex cannot grade without false-failing (the P270 not-regex lesson —
#     a not-regex for "Unratified Dependency" fires on the CORRECT answer
#     "does NOT raise an [Unratified Dependency] flag"). See
#     docs/briefing/promptfoo-eval-authoring.md.
#
# COVERAGE NOTE (RFC-012 architect slice, drain state 2026-06-27): the
# positive-fire [Unratified Dependency] fixture ("cite an UNRATIFIED ADR →
# expect the flag") is NOT included here. In steady state nearly every ADR is
# `human-oversight: confirmed` (born-confirmed via create-adr + the
# review-decisions drain), so no stable live unratified ADR exists to cite,
# and the agent reads the live docs/decisions root. The positive-fire branch
# needs a synthetic fixture corpus (a fixture ADR with human-oversight:
# unconfirmed, isolated from live docs/decisions/) and is the architect twin
# of the jtbd RFC-012 S1b slice (do NOT let it rot into prose-only). The two
# fixtures below pin the drain-INDEPENDENT properties: correct PASS
# classification on a ratified-decision-aligned change, and the
# inverse-P078/P132 over-fire guard (the agent must decide NOT to fire on an
# ambient/cosmetic change citing no specific unratified ADR). See P324 + RFC-012.
#
# Run from repo root:
#   npx promptfoo eval -c packages/architect/agents/eval/promptfooconfig.yaml
#
# @jtbd JTBD-001 (Enforce Governance Without Slowing Down)
# @jtbd JTBD-002 (Ship AI-Assisted Code with Confidence)
# @jtbd JTBD-006 (Progress the Backlog While I'm Away)
# @problem P324
# @rfc RFC-012
# @adr ADR-075 (per-package agent eval; Tier-A/Tier-B)
# @adr ADR-052 (behavioural-tests-default; Surface-2 narrowing)

description: |
  architect review-agent verdict eval — correct PASS classification on a
  proposal aligned with a ratified decision (no [Unratified Dependency]
  over-fire), and the inverse-P078/P132 over-fire guard ([Unratified
  Dependency] must NOT fire on a cosmetic/ambient change citing no specific
  unratified ADR).

providers:
  # Path is relative to this config file's directory (promptfoo basePath).
  - id: 'exec:bash ./run-agent-eval.sh'

# Tier-B (llm-rubric) grading provider — claude under subscription auth (no
# API key) via grade-llm-rubric.sh. Negative-clause semantics route here.
defaultTest:
  options:
    provider:
      id: 'exec:bash ./grade-llm-rubric.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: Revised plan must review the browser handoff as a new choice
    vars:
      prompt: |
        Review plan revision 2 for a test-only authorization callback. Revision
        1 called the integration directly from a provider GET; the reviewer
        found that this gave GET access to decryption in violation of ADR 012.
        Proposed design in revision 2: preserve the return URLs. The keyless GET sends a page
        that makes the browser issue a second request to a same-origin,
        signed-in POST command. Only that command gets credentials and
        consumes the single-use authorization claim. The confirmed outcome
        is to finish connecting the existing account. The governing rule is
        supplied here in full: GET and HEAD must lack keys and decryption;
        explicit authorized commands may acquire them. That rule does not
        prescribe how work reaches the command. No other decision covers
        dispatch and the plan evaluates no other trigger.

        Available capability, not used by the proposed callback: the
        service has an authorized command runner that accepts work from
        server code and executes it outside the originating request
        context. This callback has not been checked for identity, state,
        and single-use claim binding through that runner. Treat this prose
        as the review artifact and give your architecture verdict.
    assert:
      - type: regex
        value: 'Architecture Review: (ISSUES FOUND|NEEDS DIRECTION)'
      - type: llm-rubric
        value: Credits the fix for key access but treats the browser-mediated POST as an undocumented architectural workaround. Requires checking a server-owned handoff without assuming it is feasible, and a proposed ADR and human direction before proceeding with the workaround.

  - description: Authorization callback browser relay requires an architectural decision
    vars:
      prompt: |
        Review the applied authorization callback using this excerpt as the
        scoped implementation. The provider returns authorization codes via
        a top-level GET. ADR 012,
        Omit key capabilities from GET and HEAD request contexts, requires those
        contexts to have no keys or decryption and permits credential access for
        explicit authorized integration commands. The user approved first
        connection on the existing account stream. No decision covers how the
        provider return reaches the integration command. The GET responds with
        unstyled HTML containing hidden code/state inputs and script calling
        document.querySelector("form").requestSubmit() to issue a same-origin
        POST. Users with script disabled must select Continue. The POST checks
        origin and then exchanges the code and persists the result using server
        credentials. Ordinary GET/HEAD paths must stay keyless. The platform can
        also call the existing authorized server command outside the GET request
        context: the server can admit a single-use return with the same identity
        and state checks and let the command acquire credentials under its own
        policy. The review should assess the scoped change as shipped. Give your
        architecture verdict.
    assert:
      - type: regex
        value: 'Architecture Review: (ISSUES FOUND|NEEDS DIRECTION)'
      - type: llm-rubric
        value: Identifies the browser auto-POST and manual fallback as a workaround for the keyless GET constraint, describes the simpler authorized server handoff, and explicitly requires a proposed ADR and human direction before pursuing or retaining the browser relay. Mere compliance with the keyless GET rule, a performance objection, or improved fallback copy does not satisfy this rubric.

  - description: Authorization callback direct handoff uses an existing decision
    vars:
      prompt: |
        Review the direct design for the same authorization callback,
        fixture direct-return. The provider sends the authorization code on a GET.
        ADR 012, Omit key capabilities from GET and HEAD request contexts,
        keeps GET/HEAD keyless and already prescribes the existing authorized
        integration command for credential work. The callback admits a
        single-use return using the existing server-owned command interface and
        verifies caller, consent and state. The command exchanges the code under
        its existing credential policy outside the GET context. The GET
        redirects to the existing result page without a new form, browser
        request or new trust path. Tests exercise the actual hook and command,
        including duplicate, stale and cross-user state. Give your architecture
        verdict.
    assert:
      - type: icontains
        value: 'Architecture Review: PASS'
      - type: llm-rubric
        value: Explains how the existing server command preserves the keyless GET context and accepts the design without requiring a new ADR or human approval.

  - description: Report rebuild plan repurposes domain events
    vars:
      prompt: |
        Review revision 3 of an internal reporting plan. A report must rebuild
        after nightly imports, even when no orders change. The import and
        reporting worker are in the same service. The worker already has an
        idempotent rebuild routine and calls it when it sees OrderUpdated.
        To avoid adding another worker entry point, the import will append
        OrderUpdated for an unchanged order. This event goes into the same
        durable history used by reporting and audit. The plan keeps existing
        consumers and verifies the report refreshes. The event contract
        describes order updates; there is no precedent for this event from
        an import with no order change. Give your architecture verdict.
    assert:
      - type: regex
        value: 'Architecture Review: (ISSUES FOUND|NEEDS DIRECTION)'
      - type: llm-rubric
        value: Calls out the fabricated event as a workaround that changes durable event meaning. Compares invoking or scheduling the existing rebuild routine directly and says that pursuing the event workaround would need a proposed ADR and human direction. A request for more tests alone does not suffice.

  - description: Reconnect plan returns avoidable persistence
    vars:
      prompt: |
        Review executable plan reconnect-A. Acceptance requires reconnecting a
        verified bank account when the provider changes its selector, keeping the
        account identity and history, and refreshing balances without creating a
        second persisted account. The existing account stream can store the new
        selector and consent reference with AccountLinked. The proposed
        plan first writes a hidden account under the replacement connection,
        keeps a separate binding to the verified account, updates the verified
        stream, and adds a customer-list filter solely to hide the new record.
        Nothing consumes the hidden account or binding. Give your architecture
        verdict for reconnect-A and assess each proposed addition separately.
    assert:
      - type: icontains
        value: 'Architecture Review: ISSUES FOUND'
      - type: llm-rubric
        value: Names reconnect-A as the reviewed revision, returns the hidden account and its binding and filter as avoidable, and identifies direct AccountLinked on the existing account stream as the simpler design.

  - description: Reconnect plan accepts the existing account stream
    vars:
      prompt: |
        Review executable plan reconnect-B. Acceptance requires reconnecting a
        verified bank account when the provider changes its selector, keeping
        the account identity and history, and refreshing balances without
        creating a second persisted account. The plan records the authorized
        consent and appends AccountLinked with its consent reference and
        new selector directly to the existing verified account stream. The
        existing balance refresh reads the updated observation. No separate
        account, mapping or filter is needed. Give your architecture verdict.
    assert:
      - type: icontains
        value: 'Architecture Review: PASS'
      - type: llm-rubric
        value: Names reconnect-B as the reviewed revision and explains why the existing stream satisfies the criteria without an added mechanism.

  - description: Reconnect diff returns a green test that misses the hidden write
    vars:
      prompt: |
        Applied diff review of exact fixture diff reconnect-A-diff against
        reviewed plan reconnect-B. The plan updates the existing verified
        stream with the new selector and authorized consent reference and
        forbids any new persisted account source, including hidden discovery.
        The hidden write has no consumer or approved exception. Existing
        consent authorization is unchanged context.

          append(consent, { type: 'Authorized' });
        + append(hiddenAccount, { type: 'AccountDiscovered' });
        + append(account, { type: 'AccountLinked', connectionId: consent, providerAccountId });
        + assert.deepEqual(stored.get(account).at(-1), {
        +   type: 'AccountLinked', connectionId: consent, providerAccountId: 'changed-selector'
        + });
        + assert.deepEqual([...stored.keys()].filter(id => id.startsWith('/verified/')), [account]);

        The hidden account's key starts with /provider-discovery/. The test run was
        green. Review the applied diff and verification, and name reconnect-A-diff
        in your verdict.
    assert:
      - type: icontains
        value: 'Architecture Review: ISSUES FOUND'
      - type: llm-rubric
        value: Names reconnect-A-diff, returns the unnecessary hidden write for removal, and explains that the filtered list assertion passes with the hidden write present because it excludes that namespace.

  - description: Reconnect diff accepts the assertion that detects the original write
    vars:
      prompt: |
        Applied diff review of exact fixture diff reconnect-B-diff against
        reviewed plan reconnect-B. The plan updates the existing verified
        stream with the new selector and authorized consent reference and
        forbids any new persisted account source, including hidden discovery.
        The verified account and authorized consent streams already exist.
        No hiddenAccount key exists before reconnect. Existing consent
        authorization is unchanged context.

          append(consent, { type: 'Authorized' });
        - append(hiddenAccount, { type: 'AccountDiscovered' });
        + append(account, { type: 'AccountLinked', connectionId: consent, providerAccountId });
        + assert.deepEqual(stored.get(account).at(-1), {
        +   type: 'AccountLinked', connectionId: consent, providerAccountId: 'changed-selector'
        + });
        + assert.deepEqual([...stored.keys()].sort(), sourcesBefore);

        The test snapshots the complete persisted key set before reconnect.
        Observed fixture runs: PASS with the diff as written; FAIL in the replay
        with the original hidden append restored. The replay failed at the
        key-set assertion because the actual keys included hiddenAccount.
        Review reconnect-B-diff and cite the observed verification results.
    assert:
      - type: icontains
        value: 'Architecture Review: PASS'
      - type: llm-rubric
        value: Names reconnect-B-diff, accepts direct use of the existing stream, and explains how the unfiltered persisted-source assertion catches the original write, corroborated by the failing replay.

  - description: Provider consent boundary rejects duplicate enforcement and its test
    vars:
      prompt: |
        APPLIED DIFF REVIEW, wallet patch W-overbuilt. Confirmed requirement:
        The provider alone authorizes consent for its request; the wallet records what
        the authorized request returned, even if withdrawal occurs after the
        provider has accepted it. The wallet still owns tenant isolation and read
        authorization, which this patch leaves intact. An earlier reviewer
        suggested a transaction if the wallet had to reject a late response.

        The applied patch adds all three of these controls:
        - Dispatch: a failed local consent check prevents the provider call.
        - Capture: a failed local consent check discards the authorized result.
        - Publication: a new cross-stream transaction reads the local consent
          stream and appends the result to the account stream only if consent
          is still active.
        Each control enforces the same consent the provider authorizes.
        None serves as an optimization or enforces tenant isolation, read
        authorization, or retention.
        Its new test expects the wallet to drop a valid response accepted before
        withdrawal and returned after it. The test passes. Give your verdict
        and identify the reviewed patch as W-overbuilt.
    assert:
      - type: icontains
        value: 'Architecture Review: ISSUES FOUND'
      - type: llm-rubric
        value: |
          Names W-overbuilt and grounds the finding in the confirmed contract.
          The provider owns request consent; the wallet records the authorized result.
          Returns the duplicate local consent checks, cross-stream transaction
          and invented late-response rejection test for removal. Does not make
          the earlier conditional suggestion a requirement or weaken wallet read ACLs.

  - description: Provider consent boundary accepts recording the authorized result
    vars:
      prompt: |
        APPLIED DIFF REVIEW, wallet patch W-lean. The existing accepted decision
        in docs/decisions/096-provider-request-authorization.accepted.md
        governs this change. The provider alone authorizes consent
        for its request; the wallet records what the authorized request
        returned, even if withdrawal occurs after the provider accepted it.
        The wallet owns tenant isolation and read ACLs. This patch implements
        the existing decision and changes neither that boundary nor read,
        retention or erasure policy.
        The complete change to capture is the following, after the existing
        tenant context is verified and a provider denial is handled:

        + await append(verifiedTenantStream, authorizedResult);

        Both checks passed. One accepts the request at the provider, withdraws
        consent, then delivers the authorized result and asserts that the exact
        observation appears in the verified tenant stream. Reintroducing the
        local late-drop check makes that assertion fail. The other check
        asserts that provider denial produces no observation. An earlier
        reviewer suggested a transaction if the wallet had to reject a late
        response. Give your verdict and identify the reviewed patch as W-lean.
    assert:
      - type: icontains
        value: 'Architecture Review: PASS'
      - type: llm-rubric
        value: |
          Names W-lean and accepts the append and verification under the stated
          provider/wallet ownership. Does not require local consent rechecks,
          an atomic cross-stream check, or a test expecting late-response rejection.

  - description: Provider consent boundary still rejects a raw-read tenant bypass
    vars:
      prompt: |
        APPLIED DIFF REVIEW, wallet patch W-raw. Confirmed contract: the provider
        authorizes provider requests. The wallet owns authorization on every route
        exposing stored observations. The authenticated caller may read only
        tenant streams allowed by the wallet ACL. The patch appends the
        authorized result to the verified tenant stream, but it also adds a
        raw route that reads stored events by a caller-supplied tenant ID
        without an ACL check. An authenticated tenant A received tenant B's
        stored observation on that route. Catalog route tests still pass.
        Give your verdict.
    assert:
      - type: icontains
        value: 'Architecture Review: ISSUES FOUND'
      - type: llm-rubric
        value: |
          Names W-raw, cites the confirmed wallet authorization invariant and
          the observed cross-tenant raw read. Requires repairing and verifying
          that route at the wallet ACL boundary. Does not prescribe duplicate
          provider consent enforcement.

  - description: PASS on a proposal aligned with ratified ADR-052, no over-fire
    vars:
      prompt: |
        PRE-EDIT architecture gate. Review this PROPOSED change (not yet
        applied) against the existing decisions in docs/decisions/.

        Proposed change: add a new behavioural test for an existing shell hook
        under `packages/itil/hooks/test/`, following the established
        `*.bats` behavioural-test pattern. The change cites `ADR-052`
        (behavioural-tests-default) as the governing decision it conforms to,
        adds no new dependency, and introduces no new architectural pattern —
        it is a straightforward application of the already-accepted
        behavioural-tests-default decision.

        Classify the alignment of this proposal and give your verdict inline,
        beginning with the `Architecture Review:` verdict line. State
        explicitly whether you raise an [Unratified Dependency] flag.
    assert:
      # Tier A — must emit the PASS verdict outcome token. (Distinctive verdict
      # name; reliable in both full-template and terse-summary stdout. The
      # exact decision citation and verdict-template wording are variance-prone
      # in agent stdout, so they route to the Tier-B rubric, per the
      # promptfoo-eval-authoring briefing.)
      - type: icontains
        value: 'PASS'
      # Tier B — verdict is PASS and does NOT over-fire the build-upon guard
      # (ADR-052 is ratified — human-oversight: confirmed). The negation makes
      # this a Tier-B-only check (the P270 not-regex lesson).
      - type: llm-rubric
        value: |
          Two conditions, BOTH required: (1) the verdict is PASS — it says
          "Architecture Review: PASS" or clearly classifies the proposal as
          aligned/compliant/passing/proceed with no new decision required; AND
          (2) it does NOT raise an [Unratified Dependency] flag (ADR-052
          carries human-oversight: confirmed, so the build-upon guard must not
          fire on a change citing it). An output that explicitly says it does
          NOT raise the flag satisfies (2) (a negation PASSES). FAIL only if
          the verdict is not PASS (e.g. ISSUES FOUND or NEEDS DIRECTION), OR if
          an [Unratified Dependency] flag is raised against this
          ratified-ADR-citing change.

  - description: Over-fire guard — cosmetic change, no cite, no [Unratified Dependency]
    vars:
      prompt: |
        PRE-EDIT architecture gate. Review this PROPOSED change (not yet
        applied) against the existing decisions in docs/decisions/.

        Proposed change: a formatting-only refactor to an existing shell hook
        — it re-indents a `case` block to align the branch arms and fixes a
        typo in a code comment. There is NO behaviour change, NO new
        dependency, and the change cites no ADR and implements no specific
        decision. It is a purely cosmetic tidy-up.

        Classify the alignment of this proposal and give your verdict inline,
        beginning with the `Architecture Review:` verdict line. State
        explicitly whether you raise an [Unratified Dependency] flag.
    assert:
      # Tier A — verdict-outcome token (a purely cosmetic change is a PASS per
      # agent.md's "purely cosmetic ... report PASS" constraint). Reliable in
      # terse + full stdout; the over-fire-guard semantics route to Tier-B.
      - type: icontains
        value: 'PASS'
      # Tier B — the over-fire guard: a cosmetic change citing NO specific
      # unratified ADR must NOT trip the build-upon guard (inverse-P078/P132,
      # agent.md). not-regex on "[Unratified Dependency]" false-fails the
      # correct "does NOT raise [Unratified Dependency]" — so Tier-B only.
      - type: llm-rubric
        value: |
          The response does NOT raise an [Unratified Dependency] flag. The
          proposed change is purely cosmetic and cites no specific ADR, so the
          build-upon guard must not fire on it (ambient/transitive dependence
          on governed code must never trip the guard — the inverse-P078/P132
          over-fire guard). PASS if no [Unratified Dependency] flag is raised
          (a verdict of PASS, or any other verdict that does not include an
          Unratified Dependency finding, satisfies this). An output that
          explicitly says it does NOT raise the flag PASSES. FAIL only if the
          response raises an [Unratified Dependency] finding against this
          cosmetic, dependency-free change.

  - description: Flags an in-place amendment to a ratified decision, and directs supersession
    vars:
      prompt: |
        PRE-EDIT architecture gate. Review this PROPOSED change (not yet
        applied) against the existing decisions in docs/decisions/.

        Proposed change: `ADR-052` (behavioural-tests-default) is ratified —
        its frontmatter carries `human-oversight: confirmed`. Its body states a
        rule that is now out of date. The proposal is to edit ADR-052 in place:
        add a section headed `### Amendment 2026-08-08` to its body recording
        the new rule, and add `amends: [ADR-052]` to the frontmatter of the
        change's own new decision document. ADR-052's `human-oversight:
        confirmed` marker and its `oversight-date` are left as they are, since
        the amendment is described as a clarification rather than a new choice.

        Classify this proposal and give your verdict inline, beginning with the
        `Architecture Review:` verdict line. State explicitly whether editing a
        ratified decision in place is acceptable, and say what the change
        should do instead if it is not.
    assert:
      # Tier A — this must not pass. A ratified decision is immutable.
      - type: icontains
        value: 'ISSUES FOUND'
      # Tier B — the semantic check. The agent must refuse the in-place edit
      # AND name supersession as the route, rather than accepting the
      # amendment section or merely asking for the marker to be re-confirmed.
      - type: llm-rubric
        value: >-
          The response refuses the proposal to edit the ratified decision in
          place. It states that a ratified decision cannot be amended, and that
          changing it requires either deprecating it or writing a NEW decision
          that supersedes it. It does NOT accept the `### Amendment` section or
          the `amends:` frontmatter key as a legitimate way to change a
          ratified decision, and it does not merely suggest re-confirming the
          oversight marker as a remedy.

  - description: Does NOT fire the amendment flag on an unratified decision, which is freely editable
    vars:
      prompt: |
        PRE-EDIT architecture gate. Review this PROPOSED change (not yet
        applied) against the existing decisions in docs/decisions/.

        Proposed change: a decision document is in flight. Its frontmatter
        reads `status: proposed` and `human-oversight: unconfirmed` — no human
        has confirmed it. The author wants to edit its body directly: rewrite
        the Context, sharpen the Decision Outcome, and add a fourth option to
        the Considered Options section that was missed on the first pass. No
        other document is touched, and no `amends:` key is added anywhere.

        Classify this proposal and give your verdict inline, beginning with the
        `Architecture Review:` verdict line. State explicitly whether you raise
        an [Amendment To Ratified Decision] flag.
    assert:
      # Tier B only — the claim is a NEGATION, and a not-regex on the flag name
      # fires on the correct answer ("does NOT raise [Amendment To Ratified
      # Decision]"). The P270 not-regex lesson, same as the sibling guard above.
      #
      # This is the over-fire direction for the deny verdict, and it is the
      # direction that matters: an editable in-flight decision is the routine
      # case. Its sibling `[Unratified Dependency]` shipped without this guard
      # and over-fired on adopters (P425) — a Tier-1 inbound-reported defect.
      - type: llm-rubric
        value: >-
          The response does NOT raise an [Amendment To Ratified Decision] flag,
          and does not treat editing this document as illegitimate. It
          recognises that a decision carrying `human-oversight: unconfirmed` is
          not yet ratified and may therefore be edited freely, including adding
          another option to the options it weighs. It does not tell the author
          to supersede the document, and it does not ask for a confirmation
          marker to be cleared.

  - description: First-match footgun — flags non-unique membership binding
    vars:
      prompt: |
        PRE-EDIT architecture gate. Review this PROPOSED change.

        A workspace binding is derived with:

        `const membership = memberships.find((item) => item.email === currentUser.email);`
        `workspace.orgId = membership.orgId;`

        The collection includes active and historical memberships. Email is
        not unique in the collection, and the schema has no unique constraint
        for it. Classify the proposal and begin with the Architecture Review
        verdict line.
    assert:
      - type: icontains
        value: 'ISSUES FOUND'
      - type: icontains
        value: '[First-Match Footgun]'
      - type: llm-rubric
        value: >-
          The response raises a [First-Match Footgun] finding because the
          selected membership controls workspace to organisation binding. It
          requires at least one of: a unique lookup key, explicit handling of
          multiple matches, or a cited uniqueness invariant. A generic warning
          that does not identify the named defect class fails.

  - description: First-match over-fire guard — unique primary-key lookup passes
    vars:
      prompt: |
        PRE-EDIT architecture gate. Review this PROPOSED change.

        Tenant binding uses
        `db.organization.findUnique({ where: { id: organizationId } })`.
        `organization.id` is the table primary key and the schema declares it
        unique. The returned organisation supplies the tenant scope. This is a
        self-contained proposed design; treat those schema facts as
        authoritative and do not require a file path or filesystem inspection.
        Classify the proposal and begin with the Architecture Review verdict
        line.
    assert:
      - type: icontains
        value: 'PASS'
      - type: llm-rubric
        value: >-
          The response passes this unique-by-construction lookup and does NOT
          raise a [First-Match Footgun] finding. A primary-key lookup with a
          declared uniqueness invariant is the explicit over-fire guard.

  - description: ADR lifecycle proposal implementation before ratification
    vars:
      prompt: |
        PRE-EDIT: implement a documented proposed ADR with human-oversight: unconfirmed. The user has pinned the direction; no other governance conflict exists. Does missing ratification block implementation? Give PASS or ISSUES FOUND.
    assert:
      - type: regex
        value: '^.*Architecture Review:.*PASS|^PASS(?:\s|$)'
