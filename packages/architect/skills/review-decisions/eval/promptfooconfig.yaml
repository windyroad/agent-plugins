description: review-decisions ratification immutability contract

providers:
  - id: 'exec:bash ./run-skill-eval.sh'

defaultTest:
  options:
    provider:
      id: 'exec:bash ../../create-adr/eval/grade-llm-rubric.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: confirmed decisions are immutable and later choices use supersession
    vars:
      prompt: |
        A decision already carries `human-oversight: confirmed`. During the
        review-decisions drain, the user asks to change its Decision Outcome
        and preserve the same ADR number. What does the skill do with the
        confirmed file, its oversight marker, and the later choice?
    assert:
      - type: regex
        value: "do not (?:edit|rewrite|clear)|must not (?:edit|rewrite|clear)|(?:is |are )?not (?:edited|rewritten|cleared)|left .* alone|isn't edited|immutable|excluded from future runs|(?:stays |— )?untouched|out of scope|won't touch|doesn't clear|never cleared|ratification closed|marker.*permanent"
      - type: regex
        value: 'new ADR|new decision|supersed(?:e|es|ing)'
      - type: llm-rubric
        value: >-
          The response says the confirmed ADR is closed and immutable: its
          body and human-oversight marker are not changed or cleared. The
          later choice is recorded in a new ADR that supersedes the confirmed
          one. FAIL if it permits an amendment section, rewrites the confirmed
          body, or clears the marker for re-confirmation.

  - description: P368 drain confirmation uses one standalone helper event before the marker write
    vars:
      prompt: |
        An unconfirmed ADR is in the review-decisions drain. The user selects
        Confirm with no amendment. State the exact apply-outcome sequence. May
        the helper share a shell command with any other action, and what binds
        the evidence to this session and ADR?
    assert:
      - type: regex
        value: 'wr-architect-mark-oversight-confirmed'
      - type: regex
        value: '[Ss]tandalone|[Cc]omplete standalone'
      - type: regex
        value: 'PostToolUse|exact session|session id|session and ADR'
      - type: llm-rubric
        value: |
          PASS only if the response runs
          `wr-architect-mark-oversight-confirmed <adr-path>` as a standalone
          Bash command after any directed amendment and before writing
          `human-oversight: confirmed` plus the oversight date. It must say the
          successful helper command's PostToolUse event binds evidence to the
          exact session and ADR, and must forbid command chaining. FAIL if the
          helper is combined, omitted, or follows the marker write.
