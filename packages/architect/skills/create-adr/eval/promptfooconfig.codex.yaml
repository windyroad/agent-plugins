description: |
  Codex create-adr SKILL smoke eval. This intentionally sits beside the
  Claude promptfooconfig.yaml and exercises the Codex plugin install path via
  run-codex-skill-eval.sh.

evaluateOptions:
  maxConcurrency: 1

providers:
  - id: 'exec:bash ./run-codex-skill-eval.sh'

defaultTest:
  options:
    provider:
      id: 'exec:bash ./grade-codex-rubric.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: Codex create-adr keeps mechanical title derivation silent
    vars:
      prompt: |
        I am validating /wr-architect:create-adr under Codex. The user asks
        to record a decision about running the eval harness on every PR versus
        sampled nightly. Explain how the skill derives the ADR title/slug and
        whether it should ask the user for the title.
    assert:
      - type: regex
        value: 'silent|mechanical|does\s+not\s+(?:ask|prompt)|without\s+asking'
      - type: regex
        value: 'derive|slug|kebab'
      - type: llm-rubric
        value: |
          The response says title/slug derivation is a mechanical silent path
          and does not ask the user for a title.

  - description: Codex create-adr preserves human oversight fallback
    vars:
      prompt: |
        I am validating /wr-architect:create-adr under non-interactive
        codex exec. A draft ADR is produced in an AFK run and the user cannot
        ratify the substance in the same turn. What human-oversight marker
        should be written?
    assert:
      - type: contains
        value: 'human-oversight: unconfirmed'
      - type: llm-rubric
        value: |
          The response says non-interactive Codex runs must not invent
          ratification and should leave or write human-oversight: unconfirmed.

  - description: Codex create-adr requires a read-only cognitive PASS before presentation
    vars:
      prompt: |
        Validate the cognitive-accessibility gate. The external reviewer exists,
        has an enforced read-only sandbox, and returns PASS. Explain the exact
        ordering before the ADR is presented for ratification and whether any
        edit may occur between PASS and presentation.
    assert:
      - type: llm-rubric
        value: |
          The response requires full-ADR cognitive review to PASS before the
          summary, ADR file, and structured ratification question are presented.
          It allows no ADR edit between the final PASS and presentation.

  - description: Codex create-adr falls back only when the external reviewer cannot run safely
    vars:
      prompt: |
        Validate reviewer routing in Codex for three cases: the external
        cognitive-accessibility reviewer is not confirmed read-only; it returns
        ISSUES FOUND; and both external and bundled reviewers fail to start.
        Explain the required action for each case.
    assert:
      - type: llm-rubric
        value: |
          The response uses the bundled wr-architect-cog-a11y reviewer when the
          external reviewer is unavailable, fails to start, or is not confirmed
          read-only. ISSUES FOUND does not switch reviewers: clarity fixes are
          applied and the same path re-runs. If both paths fail, presentation
          stops.

  - description: Codex create-adr rechecks a redraft before re-presentation
    vars:
      prompt: |
        The ADR passed cognitive review, but the decision-maker selected a
        different considered option from the one recorded in the draft. Explain
        the required sequence before asking for ratification again.
    assert:
      - type: llm-rubric
        value: |
          The response requires re-drafting the ADR for the selected option,
          running cognitive accessibility review again until PASS, and only then
          re-presenting the summary, ADR file, and structured question. It does
          not write the human-oversight marker before that later confirmation.
