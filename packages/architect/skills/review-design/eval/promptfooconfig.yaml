description: review-design ratified-decision remediation contract

providers:
  - id: 'exec:bash ./run-skill-eval.sh'

defaultTest:
  options:
    provider:
      id: 'exec:bash ../../create-adr/eval/grade-llm-rubric.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: General fallback when the hosted selector is unavailable
    vars:
      prompt: |
        This is a dispatch-decision test. Do not run tools or perform a review.
        The hosted native subagent tool supports fresh general agents but has
        no agent_type selector. The installed architect instructions and
        fallback prompt helper are readable. No reviewer reported a failure.
        Apply the skill and return only JSON with reviewer_kind (named,
        general, or unavailable), copy_full_installed_instructions,
        fresh_context, original_request_preserved, manual_marker, and reason.
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output.replace(/^```(?:json)?\s*|\s*```$/g, '').trim());
          return r.reviewer_kind === 'general' && r.copy_full_installed_instructions === true
            && r.fresh_context === true && r.original_request_preserved === true
            && r.manual_marker === false;
  - description: Failed architecture review requires remediation rather than fallback
    vars:
      prompt: |
        This is a dispatch-decision test. Do not run tools or change files.
        The named architect is available and completed the review, finding
        a violation of a ratified decision. The team agrees to correct the
        implementation. Someone suggests using a general reviewer to get a pass.
        Apply the skill and return only JSON with switch_to_general,
        remediate, new_review_required, may_proceed, and reason.
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output.replace(/^```(?:json)?\s*|\s*```$/g, '').trim());
          return r.switch_to_general === false && r.remediate === true
            && r.new_review_required === true && r.may_proceed === false;
  - description: ratified conflicts require a new superseding ADR
    vars:
      prompt: |
        The architect reports that a proposed implementation conflicts with a
        ratified ADR. The team wants to adopt the new approach. Under the
        review-design remediation choices, may the existing ADR be amended in
        place, and how should the new approach be documented?
    assert:
      - type: regex
        value: 'new ADR|new decision'
      - type: regex
        value: 'supersed(?:e|es|ing)'
      - type: llm-rubric
        value: >-
          The response refuses an in-place amendment to the ratified ADR and
          directs the team to create a new ADR that supersedes it. Editing the
          existing ADR is allowed only if that ADR is still unratified. FAIL
          if it suggests adding an amendment section to the ratified ADR.
