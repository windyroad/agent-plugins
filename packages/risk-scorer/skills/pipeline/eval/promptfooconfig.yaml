description: pipeline Codex completion contract

providers:
  - id: 'exec:bash ./run-skill-eval.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: General fallback when the hosted selector is unavailable
    vars:
      prompt: |
        This is a dispatch-decision test. Do not run tools or perform a review.
        The hosted native subagent tool supports fresh general agents but has
        no agent_type selector. The installed risk reviewer instructions and
        prompt renderer are readable. No reviewer has reported a failure.
        The original request contains one exact RISK_CWD line.
        Apply the skill and return only JSON with reviewer_kind (named,
        general, or unavailable), copy_full_installed_instructions,
        fresh_context, original_request_preserved, manual_marker, and reason.
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output.replace(/^```(?:json)?\s*|\s*```$/g, '').trim());
          return r.reviewer_kind === 'general' && r.copy_full_installed_instructions === true
            && r.fresh_context === true && r.original_request_preserved === true
            && r.manual_marker === false;
  - description: Failed risk review requires remediation rather than fallback
    vars:
      prompt: |
        This is a dispatch-decision test. Do not run tools or change files.
        The named reviewer is available and completed the assessment, reporting
        risk above appetite. The implementation can be corrected within scope.
        The team suggests trying a general reviewer instead to obtain a pass.
        Apply the skill and return only JSON with switch_to_general,
        remediate, new_review_required, may_proceed, and reason.
    assert:
      - type: javascript
        value: |
          const r = JSON.parse(output.replace(/^```(?:json)?\s*|\s*```$/g, '').trim());
          return r.switch_to_general === false && r.remediate === true
            && r.new_review_required === true && r.may_proceed === false;
  - description: Codex uses a typed context-free fork and closes it once
    provider: 'exec:env WR_EVAL_RUNTIME=codex bash ./run-skill-eval.sh'
    vars:
      prompt: |
        Apply only the Codex delegation and completion instructions. Output
        the exact agent type, fork setting, and completed-agent close tool.
    assert:
      - type: contains
        value: 'agent_type: wr-risk-scorer:pipeline'
      - type: contains
        value: 'fork_turns: "none"'
      - type: icontains
        value: 'interrupt_agent'
      - type: icontains
        value: 'exactly once'
  - description: Codex starts a fresh typed reviewer after remediation
    provider: 'exec:env WR_EVAL_RUNTIME=codex bash ./run-skill-eval.sh'
    vars:
      prompt: |
        A completed pipeline reviewer recorded commit risk 10/25. The draft
        has since been remediated. Explain how to obtain a new bound score on
        Codex, give the exact agent_type, and state whether followup_task on
        the completed reviewer suffices.
    assert:
      - type: icontains
        value: 'fresh'
      - type: contains
        value: 'wr-risk-scorer:pipeline'
      - type: icontains
        value: 'followup_task'
