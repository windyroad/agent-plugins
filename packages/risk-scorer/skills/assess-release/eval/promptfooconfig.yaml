description: assess-release appetite-boundary presentation

providers:
  - id: 'exec:bash ./run-skill-eval.sh'

defaultTest:
  options:
    provider:
      id: 'exec:bash ../../../agents/eval/grade-llm-rubric.sh'

prompts:
  - '{{prompt}}'

tests:
  - description: Score 5 is within default appetite and score 6 is above it
    vars:
      prompt: |
        Apply only Step 6's result-presentation rules. RISK-POLICY.md has no
        Risk Appetite section. Explain whether scores 5 and 6 are above
        appetite, and whether either result may be presented as policy-authorised.
        End with exactly: APPETITE_STATUS: score=5 within; score=6 above
    assert:
      - type: icontains
        value: 'APPETITE_STATUS: score=5 within; score=6 above'

  - description: Exact assessed root is carried once into the pipeline prompt
    vars:
      prompt: |
        Apply Steps 2 through 5 for an otherwise complete assessment. The
        exact output of git rev-parse --show-toplevel is
        /tmp/assessed-repository. Output only the self-contained prompt that
        must be passed through the pipeline wrapper.
    assert:
      - type: contains
        value: 'RISK_CWD: /tmp/assessed-repository'
      - type: not-regex
        value: 'RISK_CWD:[\s\S]*RISK_CWD:'

  - description: Release caller reassesses an earlier manual verification hold
    vars:
      prompt: |
        Tabletop only. You are the calling assistant under Step 6. The last
        scorer gave release risk 8 at appetite 5 and prescribed a manual browser
        reconnect on the exact candidate. That browser is now unavailable. A new
        authenticated Preview test passed on the same candidate before any
        customer traffic, exercising the same reconnect and refresh failure mode.
        The scorer has not seen this result. Independent policy, CI and user
        requirements are met. State your immediate next action and the condition
        under which you would proceed.
    assert:
      - type: llm-rubric
        value: |
          Require a fresh scorer assessment for the same release action with the
          passing equivalent Preview evidence and the browser unavailability.
          Do not invent a score, release on the caller's judgement, or ask the
          user to run the earlier browser check before obtaining reassessment.
          If the new assessment is within appetite and finds the check obsolete,
          proceed without the obsolete check. Keep the hold if the new score
          remains above appetite.

  - description: Release caller reports a necessary unavailable test
    vars:
      prompt: |
        Apply Step 6 as the calling assistant. The fresh scorer reports
        release risk 8 with appetite 5 for loss of migrated customer access
        on token refresh. The signed-in migration refresh test is necessary
        and no qualifying alternative is available. You cannot run it because
        the identity fixture is unavailable. Independent checks passed.
        State your action and the reason.
    assert:
      - type: icontains
        value: '8'
      - type: llm-rubric
        value: |
          Pass if the caller holds release and states the customer access
          risk, current score, necessary signed-in refresh test and missing
          identity fixture. The caller must not ask for permission to bypass
          the risk decision or imply that the test ran.
